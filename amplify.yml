version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - echo "Ensure compatible Node version (22.21.0)"
            - export NODE_VERSION=22.21.0
            - echo "Downloading Node $NODE_VERSION to /tmp/node"
            - curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz" -o /tmp/node.tar.xz
            - mkdir -p /tmp/node
            - tar -xJf /tmp/node.tar.xz -C /tmp/node --strip-components=1
            - export PATH=/tmp/node/bin:$PATH
            - node -v
            - npm -v
            - echo "Install server dependencies"
            - cd server
            - if [ -f package-lock.json ]; then npm ci; else npm install; fi
            - cd ../client
            - echo "Install client dependencies"
            - if [ -f package-lock.json ]; then npm ci; else npm install; fi
        build:
          commands:
            - echo "Build client"
            - cd client
            - npm run build --if-present
            - echo "(Optional) Build server if script exists"
            - cd ../server
            - npm run build --if-present
      artifacts:
        # Amplify will host the frontend; point baseDirectory to your client's build output
        baseDirectory: client/build
        files:
          - '**/*'
      cache:
        paths:
          - client/node_modules/**/*
          - server/node_modules/**/*
